<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RK Shop - Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        button {
            cursor: pointer;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #f57224;
            color: white;
            padding: 15px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            border: none;
            background: white;
            color: #f57224;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* ================= MAIN ================= */

        .container {
            width: 95%;
            max-width: 1250px;
            margin: 25px auto;
        }

        .section {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 25px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 18px;
            color: #333;
        }

        /* ================= LOGIN ================= */

        #loginSection {
            max-width: 450px;
            margin: 70px auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .primary-btn {
            background: #f57224;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        /* ================= PRODUCT FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .edit-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .cancel-btn {
            background: #777;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
        }

        /* ================= SEARCH ================= */

        .search-box {
            margin-bottom: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #f57224;
            color: white;
        }

        tr:hover {
            background: #fafafa;
        }

        .product-img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 7px;
            border: 1px solid #ddd;
        }

        .action-btn {
            border: none;
            padding: 7px 11px;
            border-radius: 5px;
            color: white;
            margin: 2px;
        }

        .edit-btn {
            background: #2196f3;
        }

        .delete-btn {
            background: #e53935;
        }

        /* ================= ORDERS ================= */

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .refresh-btn {
            background: #26abd4;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .order-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            font-weight: bold;
        }

        .order-id {
            font-weight: bold;
            color: #f57224;
        }

        .total-price {
            font-weight: bold;
            color: #008000;
        }

        .no-orders {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 12px 15px;
            }

            .logo {
                font-size: 19px;
            }

            .nav-btn {
                padding: 7px 10px;
                font-size: 12px;
            }

            .container {
                width: 94%;
            }

            .section {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .orders-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar" id="navbar" style="display:none;">

        <div class="logo">
            RK Shop Admin
        </div>

        <div class="nav-right">

            <button
                class="nav-btn"
                onclick="goToShop()">
                Shop
            </button>

            <button
                class="nav-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- ================= LOGIN ================= -->

    <div class="container" id="loginSection">

        <div class="section">

            <h2>🔐 Admin Login</h2>

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username">
            </div>


            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password">
            </div>


            <button
                class="primary-btn"
                onclick="login()">
                Login
            </button>


            <div
                id="loginMessage"
                class="message">
            </div>

        </div>

    </div>


    <!-- ================= ADMIN PANEL ================= -->

    <div
        class="container"
        id="adminPanel"
        style="display:none;">

        <!-- ================= PRODUCT FORM ================= -->

        <div class="section">

            <h2 id="formTitle">
                ➕ Add Product
            </h2>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Product name">

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        id="productCategory"
                        placeholder="Example: Gaming">

                </div>


                <div class="form-group">

                    <label>
                        Price (৳)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Product price"
                        min="0">

                </div>


                <div class="form-group">

                    <label>
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        placeholder="Stock quantity"
                        min="0">

                </div>


                <div class="form-group full-width">

                    <label>
                        Image
                    </label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="Example: product.jpg">

                </div>


                <div class="form-group full-width">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Product description">
                    </textarea>

                </div>

            </div>


            <div class="edit-buttons">

                <button
                    class="primary-btn"
                    id="saveProductBtn"
                    onclick="saveProduct()">
                    Add Product
                </button>


                <button
                    class="cancel-btn"
                    id="cancelEditBtn"
                    onclick="cancelEdit()"
                    style="display:none;">
                    Cancel
                </button>

            </div>


            <div
                id="productMessage"
                class="message">
            </div>

        </div>


        <!-- ================= PRODUCTS ================= -->

        <div class="section">

            <h2>
                📦 Product Management
            </h2>


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search product..."
                    oninput="renderProducts()">

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="productTableBody">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ================= ORDERS ================= -->

        <div class="section">

            <div class="orders-header">

                <h2>
                    🛒 Orders Management
                </h2>


                <button
                    class="refresh-btn"
                    onclick="loadOrders()">
                    🔄 Refresh Orders
                </button>

            </div>


            <div
                id="ordersMessage"
                class="message">
            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Delivery</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Date</th>

                        </tr>

                    </thead>


                    <tbody id="ordersTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        /* ==================================================
           RK SHOP ADMIN PANEL
        ================================================== */


        const API_URL =
            "https://rk-shop-1.onrender.com";


        let adminToken =
            localStorage.getItem("rkAdminToken");


        let products = [];

        let editingProductId = null;


        /* ==================================================
           PAGE START
        ================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                if (adminToken) {

                    checkAdmin();

                } else {

                    showLogin();

                }

            }
        );


        /* ==================================================
           SHOW LOGIN
        ================================================== */

        function showLogin() {

            document.getElementById(
                "loginSection"
            ).style.display = "block";


            document.getElementById(
                "adminPanel"
            ).style.display = "none";


            document.getElementById(
                "navbar"
            ).style.display = "none";

        }


        /* ==================================================
           SHOW ADMIN
        ================================================== */

        function showAdmin() {

            document.getElementById(
                "loginSection"
            ).style.display = "none";


            document.getElementById(
                "adminPanel"
            ).style.display = "block";


            document.getElementById(
                "navbar"
            ).style.display = "flex";


            loadProducts();

            loadOrders();

        }


        /* ==================================================
           LOGIN
        ================================================== */

        async function login() {

            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "loginMessage"
                );


            if (!username || !password) {

                message.className =
                    "message error";

                message.textContent =
                    "Username and password required.";

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username,
                                password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok || !data.token) {

                    throw new Error(
                        data.message ||
                        "Login failed."
                    );

                }


                adminToken =
                    data.token;


                localStorage.setItem(
                    "rkAdminToken",
                    adminToken
                );


                message.className =
                    "message success";

                message.textContent =
                    "Login successful.";


                showAdmin();


            } catch (error) {

                message.className =
                    "message error";

                message.textContent =
                    error.message;

            }

        }


        /* ==================================================
           CHECK ADMIN TOKEN
        ================================================== */

        async function checkAdmin() {

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/admin/check",
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    adminToken
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Session expired."
                    );

                }


                showAdmin();


            } catch (error) {

                logout();

            }

        }


        /* ==================================================
           LOGOUT
        ================================================== */

        function logout() {

            localStorage.removeItem(
                "rkAdminToken"
            );


            adminToken = null;

            showLogin();

        }


        /* ==================================================
           LOAD PRODUCTS
        ================================================== */

        async function loadProducts() {

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/products"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not load products."
                    );

                }


                products =
                    await response.json();


                renderProducts();


            } catch (error) {

                document.getElementById(
                    "productMessage"
                ).textContent =
                    error.message;

            }

        }


        /* ==================================================
           IMAGE URL
        ================================================== */

        function getImageUrl(image) {

            if (!image) {
                return "";
            }

            return image;

        }


        /* ==================================================
           RENDER PRODUCTS
        ================================================== */

        function renderProducts() {

            const tbody =
                document.getElementById(
                    "productTableBody"
                );


            const search =
                document.getElementById(
                    "searchInput"
                ).value
                    .trim()
                    .toLowerCase();


            const filtered =
                products.filter(product => {

                    return (
                        String(product.name || "")
                            .toLowerCase()
                            .includes(search)
                        ||

                        String(product.category || "")
                            .toLowerCase()
                            .includes(search)
                    );

                });


            tbody.innerHTML = "";


            if (!filtered.length) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="6"
                            style="text-align:center;">
                            No products found.
                        </td>
                    </tr>
                `;

                return;

            }


            filtered.forEach(product => {

                /* Fixed image selection */

                const image =
                    product.image ||
                    (
                        Array.isArray(product.images)
                        && product.images.length
                            ? product.images[0]
                            : ""
                    );


                const tr =
                    document.createElement("tr");


                tr.innerHTML = `

                    <td>
                        ${
                            image
                            ?
                            `<img
                                class="product-img"
                                src="${getImageUrl(image)}"
                                alt="Product">`
                            :
                            "No Image"
                        }
                    </td>

                    <td>
                        ${escapeHtml(product.name || "")}
                    </td>

                    <td>
                        ${escapeHtml(product.category || "")}
                    </td>

                    <td>
                        ৳${Number(product.price || 0).toLocaleString()}
                    </td>

                    <td>
                        ${Number(product.stock || 0)}
                    </td>

                    <td>

                        <button
                            class="action-btn edit-btn"
                            onclick="editProduct('${product._id}')">
                            Edit
                        </button>

                        <button
                            class="action-btn delete-btn"
                            onclick="deleteProduct('${product._id}')">
                            Delete
                        </button>

                    </td>

                `;


                tbody.appendChild(tr);

            });

        }


        /* ==================================================
           ESCAPE HTML
        ================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==================================================
           SAVE PRODUCT
        ================================================== */

        async function saveProduct() {

            const name =
                document.getElementById(
                    "productName"
                ).value.trim();


            const category =
                document.getElementById(
                    "productCategory"
                ).value.trim();


            const price =
                Number(
                    document.getElementById(
                        "productPrice"
                    ).value
                );


            const stock =
                Number(
                    document.getElementById(
                        "productStock"
                    ).value
                );


            const image =
                document.getElementById(
                    "productImage"
                ).value.trim();


            const description =
                document.getElementById(
                    "productDescription"
                ).value.trim();


            const message =
                document.getElementById(
                    "productMessage"
                );


            if (!name) {

                message.className =
                    "message error";

                message.textContent =
                    "Product name required.";

                return;

            }


            if (price < 0 || stock < 0) {

                message.className =
                    "message error";

                message.textContent =
                    "Price and stock cannot be negative.";

                return;

            }


            const productData = {

                name,
                category,
                price,
                stock,
                image,
                description

            };


            try {

                let url =
                    API_URL +
                    "/api/products";


                let method = "POST";


                if (editingProductId) {

                    url =
                        API_URL +
                        "/api/products/" +
                        editingProductId;

                    method = "PUT";

                }


                const response =
                    await fetch(
                        url,
                        {
                            method,

                            headers: {
                                "Content-Type":
                                    "application/json",

                                Authorization:
                                    "Bearer " +
                                    adminToken
                            },

                            body:
                                JSON.stringify(
                                    productData
                                )
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not save product."
                    );

                }


                message.className =
                    "message success";


                message.textContent =
                    editingProductId
                    ? "Product updated successfully."
                    : "Product added successfully.";


                clearForm();

                await loadProducts();


            } catch (error) {

                message.className =
                    "message error";

                message.textContent =
                    error.message;

            }

        }


        /* ==================================================
           EDIT PRODUCT
        ================================================== */

        function editProduct(id) {

            const product =
                products.find(
                    item =>
                        String(item._id) ===
                        String(id)
                );


            if (!product) {
                return;
            }


            editingProductId =
                product._id;


            document.getElementById(
                "formTitle"
            ).textContent =
                "✏️ Edit Product";


            document.getElementById(
                "productName"
            ).value =
                product.name || "";


            document.getElementById(
                "productCategory"
            ).value =
                product.category || "";


            document.getElementById(
                "productPrice"
            ).value =
                product.price || 0;


            document.getElementById(
                "productStock"
            ).value =
                product.stock || 0;


            document.getElementById(
                "productImage"
            ).value =
                product.image ||
                (
                    Array.isArray(product.images)
                    && product.images.length
                        ? product.images[0]
                        : ""
                );


            document.getElementById(
                "productDescription"
            ).value =
                product.description || "";


            document.getElementById(
                "saveProductBtn"
            ).textContent =
                "Update Product";


            document.getElementById(
                "cancelEditBtn"
            ).style.display =
                "inline-block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* ==================================================
           CANCEL EDIT
        ================================================== */

        function cancelEdit() {

            clearForm();

        }


        /* ==================================================
           CLEAR FORM
        ================================================== */

        function clearForm() {

            editingProductId = null;


            document.getElementById(
                "formTitle"
            ).textContent =
                "➕ Add Product";


            document.getElementById(
                "productName"
            ).value = "";


            document.getElementById(
                "productCategory"
            ).value = "";


            document.getElementById(
                "productPrice"
            ).value = "";


            document.getElementById(
                "productStock"
            ).value = "";


            document.getElementById(
                "productImage"
            ).value = "";


            document.getElementById(
                "productDescription"
            ).value = "";


            document.getElementById(
                "saveProductBtn"
            ).textContent =
                "Add Product";


            document.getElementById(
                "cancelEditBtn"
            ).style.display =
                "none";

        }


        /* ==================================================
           DELETE PRODUCT
        ================================================== */

        async function deleteProduct(id) {

            const product =
                products.find(
                    item =>
                        String(item._id) ===
                        String(id)
                );


            if (!product) {
                return;
            }


            const confirmed =
                confirm(
                    `Delete "${product.name}"?`
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/products/" +
                        id,
                        {
                            method: "DELETE",

                            headers: {
                                Authorization:
                                    "Bearer " +
                                    adminToken
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not delete product."
                    );

                }


                await loadProducts();


            } catch (error) {

                alert(error.message);

            }

        }


        /* ==================================================
           LOAD ORDERS
        ================================================== */

        async function loadOrders() {

            const tbody =
                document.getElementById(
                    "ordersTableBody"
                );


            const message =
                document.getElementById(
                    "ordersMessage"
                );


            tbody.innerHTML = `

                <tr>
                    <td colspan="11"
                        style="text-align:center;">
                        Loading orders...
                    </td>
                </tr>

            `;


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/orders",
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    adminToken
                            }
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not load orders."
                    );

                }


                renderOrders(data);


                message.textContent = "";


            } catch (error) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="11"
                            style="text-align:center;color:red;">

                            ${escapeHtml(error.message)}

                        </td>

                    </tr>

                `;

            }

        }


        /* ==================================================
           RENDER ORDERS
        ================================================== */

        function renderOrders(orders) {

            const tbody =
                document.getElementById(
                    "ordersTableBody"
                );


            tbody.innerHTML = "";


            if (!Array.isArray(orders) || !orders.length) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="11"
                            class="no-orders">

                            No orders yet.

                        </td>

                    </tr>

                `;

                return;

            }


            orders.forEach(order => {

                const product =
                    order.product || {};


                const customer =
                    order.customer || {};


                const delivery =
                    order.delivery || {};


                const date =
                    order.createdAt
                    ?
                    new Date(
                        order.createdAt
                    ).toLocaleString()
                    :
                    "-";


                const status =
                    order.status ||
                    "Pending";


                const tr =
                    document.createElement("tr");


                tr.innerHTML = `

                    <td>
                        <span class="order-id">
                            ${escapeHtml(
                                order.orderId || "-"
                            )}
                        </span>
                    </td>


                    <td>
                        ${escapeHtml(
                            customer.name || "-"
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            customer.phone || "-"
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            product.name || "-"
                        )}
                    </td>


                    <td>
                        ${Number(
                            product.quantity || 0
                        )}
                    </td>


                    <td>
                        ৳${Number(
                            product.price || 0
                        ).toLocaleString()}
                    </td>


                    <td>
                        ${escapeHtml(
                            delivery.area || "-"
                        )}
                    </td>


                    <td>
                        <span class="total-price">
                            ৳${Number(
                                order.total || 0
                            ).toLocaleString()}
                        </span>
                    </td>


                    <td>
                        ${escapeHtml(
                            order.paymentMethod || "COD"
                        )}
                    </td>


                    <td>
                        <span class="order-status">
                            ${escapeHtml(status)}
                        </span>
                    </td>


                    <td>
                        ${escapeHtml(date)}
                    </td>

                `;


                tbody.appendChild(tr);

            });

        }


        /* ==================================================
           GO TO SHOP
        ================================================== */

        function goToShop() {

            window.location.href =
                "index.html";

        }

    </script>

</body>
</html>
