<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RK Shop - Admin Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
    text-align:center;
    color:#f57224;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#f57224;
}

.login-btn{
    width:100%;
    padding:13px;
    background:#f57224;
    color:white;
    border:none;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    opacity:.9;
}

#loginMessage{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

/* ADMIN */

#adminPage{
    display:none;
}

header{
    background:#f57224;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

header h1{
    font-size:23px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-buttons button,
.header-buttons a{
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
}

.home-btn{
    background:white;
    color:#f57224;
}

.logout-btn{
    background:#dc3545;
    color:white;
}

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto;
}

.box{
    background:white;
    padding:25px;
    border-radius:10px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.box h2{
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#f57224;
}

.buttons{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    cursor:pointer;
    padding:11px 17px;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
}

.add-btn{
    background:#f57224;
    color:white;
}

.update-btn{
    background:#198754;
    color:white;
    display:none;
}

.cancel-btn{
    background:#6c757d;
    color:white;
    display:none;
}

.refresh-btn{
    background:#0d6efd;
    color:white;
}

.search-area{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-area input{
    flex:1;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f57224;
    color:white;
}

.product-img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:6px;
    border:1px solid #ddd;
}

.action-buttons{
    display:flex;
    gap:6px;
}

.edit-btn{
    background:#ffc107;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

#status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    font-weight:bold;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .search-area{
        flex-direction:column;
    }

    header{
        padding:15px;
    }

    .container{
        width:94%;
    }

    .box{
        padding:18px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

    <div class="login-box">

        <h1>🔐 RK Shop</h1>

        <p>Admin Panel Login</p>

        <form id="loginForm">

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Admin username"
                    required
                >

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Admin password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                🔐 Login
            </button>

        </form>

        <div id="loginMessage"></div>

    </div>

</div>


<!-- ADMIN PAGE -->

<div id="adminPage">

<header>

    <h1>🛍️ RK Shop Admin Panel</h1>

    <div class="header-buttons">

        <!-- FIXED SHOP LINK -->
        <a
            href="index.html"
            class="home-btn"
        >
            🏠 Shop
        </a>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>

</header>


<div class="container">


<!-- PRODUCT FORM -->

<div class="box">

    <h2 id="formTitle">
        ➕ Add New Product
    </h2>

    <form id="productForm">

        <div class="form-grid">

            <div class="form-group">

                <label>Product Name *</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Premium Power Bank"
                    required
                >

            </div>


            <div class="form-group">

                <label>Category *</label>

                <input
                    type="text"
                    id="category"
                    placeholder="Electronics"
                    required
                >

            </div>


            <div class="form-group">

                <label>Price (৳) *</label>

                <input
                    type="number"
                    id="price"
                    min="0"
                    placeholder="1200"
                    required
                >

            </div>


            <div class="form-group">

                <label>Stock</label>

                <input
                    type="number"
                    id="stock"
                    min="0"
                    value="0"
                >

            </div>


            <div class="form-group full">

                <label>Image 1</label>

                <input
                    type="text"
                    id="image1"
                    placeholder="images/product-front.jpg"
                >

            </div>


            <div class="form-group full">

                <label>Image 2</label>

                <input
                    type="text"
                    id="image2"
                    placeholder="images/product-back.jpg"
                >

            </div>


            <div class="form-group full">

                <label>Image 3</label>

                <input
                    type="text"
                    id="image3"
                    placeholder="images/product-side.jpg"
                >

            </div>


            <div class="form-group full">

                <label>Image 4</label>

                <input
                    type="text"
                    id="image4"
                    placeholder="images/product-box.jpg"
                >

            </div>


            <div class="form-group full">

                <label>Image 5</label>

                <input
                    type="text"
                    id="image5"
                    placeholder="images/product-5.jpg"
                >

            </div>


            <div class="form-group full">

                <label>Image 6</label>

                <input
                    type="text"
                    id="image6"
                    placeholder="images/product-6.jpg"
                >

            </div>


            <div class="form-group full">

                <label>Description</label>

                <textarea
                    id="description"
                    placeholder="Product description..."
                ></textarea>

            </div>

        </div>


        <div class="buttons">

            <button
                type="submit"
                class="add-btn"
                id="addBtn"
            >
                ➕ Add Product
            </button>


            <button
                type="button"
                class="update-btn"
                id="updateBtn"
            >
                ✏️ Update Product
            </button>


            <button
                type="button"
                class="cancel-btn"
                id="cancelBtn"
            >
                ❌ Cancel
            </button>

        </div>


        <div id="status"></div>

    </form>

</div>


<!-- PRODUCTS -->

<div class="box">

    <h2>📦 Products</h2>

    <div class="search-area">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Search product..."
        >

        <button
            class="refresh-btn"
            onclick="loadProducts()"
        >
            🔄 Refresh
        </button>

    </div>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Images</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="productTable"></tbody>

        </table>

    </div>

</div>

</div>

</div>


<script>

/* LIVE BACKEND */

const API_URL =
    "https://rk-shop-1.onrender.com";


/* VARIABLES */

let products = [];

let editingProductId = null;


/* PAGE ELEMENTS */

const loginPage =
    document.getElementById("loginPage");

const adminPage =
    document.getElementById("adminPage");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const loginBtn =
    document.getElementById("loginBtn");


/* LOGIN */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const username =
            document.getElementById(
                "loginUsername"
            ).value.trim();

        const password =
            document.getElementById(
                "loginPassword"
            ).value;

        loginBtn.disabled = true;

        loginBtn.textContent =
            "Logging in...";

        try{

            const response =
                await fetch(
                    API_URL +
                    "/api/admin/login",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            username,
                            password
                        })

                    }
                );

            const data =
                await response.json();

            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Login failed"
                );

            }

            localStorage.setItem(
                "rk_admin_token",
                data.token
            );

            loginMessage.textContent =
                "✅ Login successful!";

            loginMessage.style.color =
                "#198754";

            showAdminPage();

        }catch(error){

            loginMessage.textContent =
                "❌ " + error.message;

            loginMessage.style.color =
                "#dc3545";

        }finally{

            loginBtn.disabled = false;

            loginBtn.textContent =
                "🔐 Login";

        }

    }
);


/* SHOW ADMIN */

function showAdminPage(){

    loginPage.style.display =
        "none";

    adminPage.style.display =
        "block";

    loadProducts();

}


/* CHECK EXISTING LOGIN */

async function checkLogin(){

    const token =
        localStorage.getItem(
            "rk_admin_token"
        );

    if(!token){

        return;

    }

    try{

        const response =
            await fetch(
                API_URL +
                "/api/admin/check",
                {

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }

                }
            );

        if(response.ok){

            showAdminPage();

        }else{

            localStorage.removeItem(
                "rk_admin_token"
            );

        }

    }catch(error){

        console.log(
            "Auth check failed"
        );

    }

}


/* AUTH HEADERS */

function authHeaders(){

    const token =
        localStorage.getItem(
            "rk_admin_token"
        );

    return {

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + token

    };

}


/* STATUS */

function showStatus(
    message,
    type
){

    const box =
        document.getElementById(
            "status"
        );

    box.textContent =
        message;

    box.className =
        type;

    box.style.display =
        "block";

    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        4000
    );

}


/* FORM DATA */

function getFormData(){

    const images = [

        document.getElementById(
            "image1"
        ).value.trim(),

        document.getElementById(
            "image2"
        ).value.trim(),

        document.getElementById(
            "image3"
        ).value.trim(),

        document.getElementById(
            "image4"
        ).value.trim(),

        document.getElementById(
            "image5"
        ).value.trim(),

        document.getElementById(
            "image6"
        ).value.trim()

    ].filter(Boolean);

    return {

        name:
            document.getElementById(
                "name"
            ).value.trim(),

        category:
            document.getElementById(
                "category"
            ).value.trim(),

        price:
            Number(
                document.getElementById(
                    "price"
                ).value
            ),

        stock:
            Number(
                document.getElementById(
                    "stock"
                ).value
            ) || 0,

        image:
            images[0] || "",

        images:
            images,

        description:
            document.getElementById(
                "description"
            ).value.trim()

    };

}


/* ADD PRODUCT */

document
.getElementById("productForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const product =
            getFormData();

        try{

            const response =
                await fetch(
                    API_URL +
                    "/api/products",
                    {

                        method:"POST",

                        headers:
                            authHeaders(),

                        body:
                            JSON.stringify(
                                product
                            )

                    }
                );

            const data =
                await response.json();

            if(
                response.status === 401 ||
                response.status === 403
            ){

                logout();

                return;

            }

            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Product add failed"
                );

            }

            showStatus(
                "✅ Product added successfully!",
                "success"
            );

            resetForm();

            loadProducts();

        }catch(error){

            showStatus(
                "❌ " + error.message,
                "error"
            );

        }

    }
);


/* LOAD PRODUCTS */

async function loadProducts(){

    const table =
        document.getElementById(
            "productTable"
        );

    table.innerHTML = `

        <tr>
            <td colspan="7">
                Loading products...
            </td>
        </tr>

    `;

    try{

        const response =
            await fetch(
                API_URL +
                "/api/products"
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data.message ||
                "Products load failed"
            );

        }

        products =
            data.products || [];

        renderProducts(
            products
        );

    }catch(error){

        table.innerHTML = `

            <tr>

                <td colspan="7">
                    ❌ ${escapeHTML(error.message)}
                </td>

            </tr>

        `;

    }

}


/* RENDER PRODUCTS */

function renderProducts(list){

    const table =
        document.getElementById(
            "productTable"
        );

    if(!list.length){

        table.innerHTML = `

            <tr>

                <td colspan="7">
                    No products found.
                </td>

            </tr>

        `;

        return;

    }

    table.innerHTML =
        list.map(
            function(product){

                const images =
                    Array.isArray(
                        product.images
                    ) &&
                    product.images.length
                        ? product.images
                        : product.image
                            ? [product.image]
                            : [];

                const mainImage =
                    images[0] || "";

                const imageHTML =
                    mainImage

                    ? `

                        <img
                            src="../${escapeHTML(mainImage)}"
                            class="product-img"
                            onerror="
                                this.style.display='none'
                            "
                        >

                    `

                    : "No Image";

                return `

                    <tr>

                        <td>
                            ${imageHTML}
                        </td>

                        <td>
                            <strong>
                                ${escapeHTML(
                                    product.name
                                )}
                            </strong>
                        </td>

                        <td>
                            ${escapeHTML(
                                product.category
                            )}
                        </td>

                        <td>
                            ৳${Number(
                                product.price
                            ).toLocaleString()}
                        </td>

                        <td>
                            ${product.stock ?? 0}
                        </td>

                        <td>
                            ${images.length}
                        </td>

                        <td>

                            <div class="action-buttons">

                                <button
                                    class="edit-btn"
                                    onclick="
                                        editProduct(
                                            '${product._id}'
                                        )
                                    "
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    class="delete-btn"
                                    onclick="
                                        deleteProduct(
                                            '${product._id}'
                                        )
                                    "
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}


/* EDIT */

function editProduct(id){

    const product =
        products.find(
            item =>
                item._id === id
        );

    if(!product){

        return;

    }

    editingProductId =
        id;

    document.getElementById(
        "name"
    ).value =
        product.name || "";

    document.getElementById(
        "category"
    ).value =
        product.category || "";

    document.getElementById(
        "price"
    ).value =
        product.price || 0;

    document.getElementById(
        "stock"
    ).value =
        product.stock || 0;

    document.getElementById(
        "description"
    ).value =
        product.description || "";

    const images =
        Array.isArray(
            product.images
        ) &&
        product.images.length
            ? product.images
            : product.image
                ? [product.image]
                : [];

    for(
        let i = 1;
        i <= 6;
        i++
    ){

        document.getElementById(
            "image" + i
        ).value =
            images[i - 1] || "";

    }

    document.getElementById(
        "formTitle"
    ).textContent =
        "✏️ Edit Product";

    document.getElementById(
        "addBtn"
    ).style.display =
        "none";

    document.getElementById(
        "updateBtn"
    ).style.display =
        "inline-block";

    document.getElementById(
        "cancelBtn"
    ).style.display =
        "inline-block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* UPDATE */

document
.getElementById("updateBtn")
.addEventListener(
    "click",
    async function(){

        if(!editingProductId){

            return;

        }

        const product =
            getFormData();

        try{

            const response =
                await fetch(
                    API_URL +
                    "/api/products/" +
                    editingProductId,
                    {

                        method:"PUT",

                        headers:
                            authHeaders(),

                        body:
                            JSON.stringify(
                                product
                            )

                    }
                );

            const data =
                await response.json();

            if(
                response.status === 401 ||
                response.status === 403
            ){

                logout();

                return;

            }

            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Update failed"
                );

            }

            showStatus(
                "✅ Product updated successfully!",
                "success"
            );

            resetForm();

            loadProducts();

        }catch(error){

            showStatus(
                "❌ " + error.message,
                "error"
            );

        }

    }
);


/* DELETE */

async function deleteProduct(id){

    const product =
        products.find(
            item =>
                item._id === id
        );

    if(
        !confirm(
            `Delete "${product?.name || "this product"}"?`
        )
    ){

        return;

    }

    try{

        const response =
            await fetch(
                API_URL +
                "/api/products/" +
                id,
                {

                    method:"DELETE",

                    headers:
                        authHeaders()

                }
            );

        const data =
            await response.json();

        if(
            response.status === 401 ||
            response.status === 403
        ){

            logout();

            return;

        }

        if(!response.ok){

            throw new Error(
                data.message ||
                "Delete failed"
            );

        }

        showStatus(
            "✅ Product deleted!",
            "success"
        );

        loadProducts();

    }catch(error){

        showStatus(
            "❌ " + error.message,
            "error"
        );

    }

}


/* RESET FORM */

function resetForm(){

    document
    .getElementById(
        "productForm"
    )
    .reset();

    document.getElementById(
        "stock"
    ).value = 0;

    editingProductId =
        null;

    document.getElementById(
        "formTitle"
    ).textContent =
        "➕ Add New Product";

    document.getElementById(
        "addBtn"
    ).style.display =
        "inline-block";

    document.getElementById(
        "updateBtn"
    ).style.display =
        "none";

    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";

}


/* CANCEL */

document
.getElementById("cancelBtn")
.addEventListener(
    "click",
    resetForm
);


/* SEARCH */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        const keyword =
            this.value
                .toLowerCase()
                .trim();

        if(!keyword){

            renderProducts(
                products
            );

            return;

        }

        const filtered =
            products.filter(
                function(product){

                    return (

                        String(
                            product.name || ""
                        )
                        .toLowerCase()
                        .includes(keyword)

                        ||

                        String(
                            product.category || ""
                        )
                        .toLowerCase()
                        .includes(keyword)

                    );

                }
            );

        renderProducts(
            filtered
        );

    }
);


/* LOGOUT */

function logout(){

    localStorage.removeItem(
        "rk_admin_token"
    );

    adminPage.style.display =
        "none";

    loginPage.style.display =
        "flex";

    document.getElementById(
        "loginPassword"
    ).value = "";

}


/* ESCAPE HTML */

function escapeHTML(value){

    return String(value || "")
        .replace(
